set_schedule:
  name: Set weekday schedule
  description: Set one mower weekday schedule and verify it by reading it back.
  fields:
    config_entry_id:
      name: Mower
      description: Select the configured mower.
      required: true
      selector:
        config_entry:
          integration: lyfco_mower
    day:
      name: Weekday
      required: true
      selector:
        select:
          options:
            - label: Sunday
              value: "0"
            - label: Monday
              value: "1"
            - label: Tuesday
              value: "2"
            - label: Wednesday
              value: "3"
            - label: Thursday
              value: "4"
            - label: Friday
              value: "5"
            - label: Saturday
              value: "6"
    start_time:
      name: Start time
      required: true
      selector:
        time:
    edge_mowing:
      name: Edge mowing
      default: false
      selector:
        boolean:
    area_1_minutes:
      name: Area 1 minutes
      default: 0
      selector:
        number:
          min: 0
          max: 250
          step: 10
          unit_of_measurement: min
          mode: slider
    area_2_minutes:
      name: Area 2 minutes
      default: 0
      selector:
        number:
          min: 0
          max: 250
          step: 10
          unit_of_measurement: min
          mode: slider
    area_3_minutes:
      name: Area 3 minutes
      default: 0
      selector:
        number:
          min: 0
          max: 250
          step: 10
          unit_of_measurement: min
          mode: slider
    area_4_minutes:
      name: Area 4 minutes
      default: 0
      selector:
        number:
          min: 0
          max: 250
          step: 10
          unit_of_measurement: min
          mode: slider
    area_5_minutes:
      name: Area 5 minutes
      default: 0
      selector:
        number:
          min: 0
          max: 250
          step: 10
          unit_of_measurement: min
          mode: slider
    area_6_minutes:
      name: Area 6 minutes
      default: 0
      selector:
        number:
          min: 0
          max: 250
          step: 10
          unit_of_measurement: min
          mode: slider
